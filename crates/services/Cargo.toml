[package]
name = "samo-services"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Samo browser services: paths, config, themes, store, session, omnibox, keys (no CEF)"
build = "build.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
toml = "0.8"
toml_edit = "0.22"
notify = "8"
rusqlite = { version = "0.37", features = ["bundled", "functions"] }
percent-encoding = "2"
dirs = "6"

[dev-dependencies]
tempfile = "3"
