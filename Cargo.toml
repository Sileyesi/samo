[workspace]
members = [".", "crates/services"]
resolver = "3"

[package]
name = "samo"
version = "0.1.0"
edition = "2024"
description = "Samo — a smooth, deeply customizable Chromium browser"

[dependencies]
cef = { version = "=154.5.0", default-features = false, features = ["build-util", "resources"] }
samo-services = { path = "crates/services" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
